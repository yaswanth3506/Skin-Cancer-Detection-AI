<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinical Intake - DermaScan AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <nav class="border-b border-slate-800 bg-slate-900/40 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-2.5 h-2.5 bg-cyan-500 rounded-full animate-pulse"></div>
            <span class="font-mono text-xs tracking-widest text-slate-400">DERMASCAN CLINICAL CONSOLE v2.5</span>
        </div>
        <div class="flex items-center gap-6">
            <span class="text-sm text-slate-400">Operator ID: <strong class="text-slate-200">{{ username }}</strong></span>
            <a href="/logout" class="text-xs bg-slate-900 hover:bg-rose-950/40 hover:text-rose-400 text-slate-300 px-3 py-1.5 rounded border border-slate-800 transition">Log Out</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto mt-20 px-4">
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-8 shadow-2xl backdrop-blur-md">
            <h2 class="text-xl font-semibold text-white mb-1 tracking-tight">Patient Diagnostic Lab</h2>
            <p class="text-slate-400 text-xs mb-8">System filters non-skin artifacts. Upload close-up structural macro captures.</p>

            <form action="/predict" method="POST" enctype="multipart/form-data" class="space-y-6">
                <div class="border border-dashed border-slate-700 hover:border-cyan-500/50 rounded-xl p-12 text-center bg-slate-950/40 hover:bg-slate-950/80 transition relative group cursor-pointer">
                    <input type="file" name="file" multiple required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="space-y-3">
                        <div class="text-cyan-400 font-mono text-xs tracking-wider group-hover:text-cyan-300">UPLOAD PATIENT IMAGE MATRIX (BATCH MODE)</div>
                        <p class="text-xs text-slate-500">Supports simultaneous multiple uploads (PNG, JPG, JPEG)</p>
                    </div>
                </div>

                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 py-3 rounded font-mono font-bold tracking-wider text-xs transition shadow-lg shadow-cyan-500/10">
                    RUN PIPELINE SCAN ANALYSIS
                </button>
            </form>
        </div>
    </main>

</body>
</html>
