<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Skin Scan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-blue-600 rounded-full"></div>
            <span class="font-bold text-gray-900 tracking-wide">Skin Scan AI</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm text-gray-600">User: <strong class="text-gray-950">{{ username }}</strong></span>
            <a href="/logout" class="text-xs bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-700 px-3 py-1.5 rounded border border-gray-300 transition font-medium">Log Out</a>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto mt-16 px-4">
        <div class="bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
            <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">Upload Skin Images</h2>
            <p class="text-gray-500 text-sm mb-8 text-center">Please upload clear, close-up photos of the skin area you want to check. You can select and upload multiple images at the same time.</p>

            <form action="/predict" method="POST" enctype="multipart/form-data" class="space-y-6">
                <div class="border-2 border-dashed border-gray-300 hover:border-blue-500 rounded-xl p-12 text-center bg-gray-50 hover:bg-blue-50/30 transition relative group cursor-pointer">
                    <input type="file" id="file-input" name="file" multiple required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="space-y-2">
                        <div id="upload-text" class="text-blue-600 font-semibold text-sm group-hover:text-blue-700">
                            Click here to select your images
                        </div>
                        <p class="text-xs text-gray-400">Supports standard photo formats (PNG, JPG, JPEG)</p>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold text-sm transition shadow-sm">
                    Start Image Analysis
                </button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('file-input').addEventListener('change', function(e) {
            const count = e.target.files.length;
            const textElement = document.getElementById('upload-text');
            
            if (count === 1) {
                textElement.innerHTML = "✅ 1 image selected";
                textElement.className = "text-green-600 font-semibold text-sm";
            } else if (count > 1) {
                textElement.innerHTML = `✅ ${count} images selected`;
                textElement.className = "text-green-600 font-semibold text-sm";
            } else {
                textElement.innerHTML = "Click here to select your images";
                textElement.className = "text-blue-600 font-semibold text-sm";
            }
        });
    </script>

</body>
</html>
