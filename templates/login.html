<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Skin Cancer Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96 border border-gray-200">
        <h1 class="text-xl font-bold text-center mb-6 text-gray-800">Login</h1>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="bg-red-100 text-red-700 p-2 rounded mb-4 text-sm text-center border border-red-200">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-600">Username</label>
                <input type="text" name="username" required class="w-full mt-1 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600">Password</label>
                <input type="password" name="password" required class="w-full mt-1 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold transition">Login</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-500">Don't have an account? <a href="/register" class="text-blue-600 hover:underline">Register here</a></p>
    </div>
</body>
</html>
