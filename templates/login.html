<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - DermaScan AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-96 border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">User Login</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="bg-rose-100 text-rose-700 p-3 mb-4 rounded text-sm text-center">
                {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Username</label>
                <input type="text" name="username" required 
                    class="w-full mt-1 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Password</label>
                <input type="password" name="password" required 
                    class="w-full mt-1 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
            </div>

            <button type="submit" 
                class="w-full bg-slate-900 text-white py-2 rounded-lg hover:bg-slate-800 transition font-bold mt-4">
                Login
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-slate-500">
            Don't have an account? <a href="/register" class="text-rose-600 hover:underline">Register here</a>
        </p>
    </div>

</body>
</html>
