<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login - Clinical Console</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900/50 border border-slate-800 p-8 rounded-xl w-96 shadow-2xl backdrop-blur-sm">
        <h1 class="text-xs font-mono tracking-widest text-cyan-400 text-center mb-6">CLINICAL HARDWARE LOG IN</h1>
        {% with m = get_flashed_messages() %}{% if m %}<div class="bg-rose-950/50 border border-rose-900/60 text-rose-400 p-2.5 mb-4 rounded text-xs text-center font-mono">{{ m[0] }}</div>{% endif %}{% endwith %}
        <form method="POST" class="space-y-4">
            <div><label class="block text-[10px] font-mono tracking-wider text-slate-400 uppercase">Clinician ID</label><input type="text" name="username" required class="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded font-mono text-sm text-white focus:border-cyan-500 outline-none"></div>
            <div><label class="block text-[10px] font-mono tracking-wider text-slate-400 uppercase">Security Token</label><input type="password" name="password" required class="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded font-mono text-sm text-white focus:border-cyan-500 outline-none"></div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 py-2 rounded font-mono font-bold text-xs mt-2 transition">VERIFY MODULE ACCESS</button>
        </form>
        <p class="mt-6 text-center text-[11px] text-slate-500 font-mono">No profile? <a href="/register" class="text-cyan-500 hover:underline">Register New Clinician</a></p>
    </div>
</body>
</html>
